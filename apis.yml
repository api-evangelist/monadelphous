description: Monadelphous is an ASX-200 listed Australian engineering group providing multidisciplinary construction, maintenance and industrial services to many of the largest companies in the resources,
  energy and infrastructure sectors. Founded in Kalgoorlie, Western Australia in 1972 as Contract Engineering Associates (CEA), it adopted the Monadelphous name in 1978. Its website publishes no public
  API, developer portal or API documentation; portal.monadelphous.com.au is a Citrix StoreWeb remote-access login for staff, not a developer portal.

